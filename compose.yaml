services:
  backend:
    build: .
    container_name: securecare-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=SecureCare Healthcare Management System
      - VERSION=1.0.0
      - API_V1_STR=/api
      - DATABASE_URL=sqlite:////data/securecare.db
      - SECRET_KEY=${SECRET_KEY:-c83f942ba621980ee9d41e73797c5fba609f25efd03158c3534e75d1d4d39f4a}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - MAX_LOGIN_ATTEMPTS=5
      - LOGIN_LOCKOUT_MINUTES=15
      - ALLOWED_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost:8080","http://127.0.0.1:8080","http://localhost:8000","http://127.0.0.1:8000"]
      - JIRA_BASE_URL=${JIRA_BASE_URL:-https://sakec-team-bcq481n1.atlassian.net}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_PROJECT_KEY=${JIRA_PROJECT_KEY:-SCR}
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: securecare-frontend
    restart: unless-stopped
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    ports:
      - "5173:5173"
      - "8080:5173"
    depends_on:
      - backend

volumes:
  backend_data:
    name: securecare_backend_data
